worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  log_format safe '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=teacher_per_ip:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/s;
  limit_req_status 429;

  upstream carbon_api { server api:3001; keepalive 32; }
  upstream teacher_web { server teacher-web:3000; keepalive 16; }
  upstream student_web { server student-web:8080; keepalive 16; }

  server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 2m;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    error_page 502 503 504 /upstream-unavailable.html;
    location = /upstream-unavailable.html { internal; root /usr/share/nginx/html; }

    location = __PUBLIC_BASE_PATH__ { return 301 __PUBLIC_BASE_PATH__/; }
    location = __PUBLIC_BASE_PATH__/proxy-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location = __PUBLIC_BASE_PATH__/v1/auth/login {
      limit_req zone=login_per_ip burst=60 nodelay;
      rewrite ^__PUBLIC_BASE_PATH__(/.*)$ $1 break;
      proxy_pass http://carbon_api;
      include /etc/nginx/proxy_params;
    }
    location = __PUBLIC_BASE_PATH__/v1/auth/student/register {
      limit_req zone=login_per_ip burst=60 nodelay;
      rewrite ^__PUBLIC_BASE_PATH__(/.*)$ $1 break;
      proxy_pass http://carbon_api;
      include /etc/nginx/proxy_params;
    }
    location = __PUBLIC_BASE_PATH__/v1/auth/refresh {
      limit_req zone=login_per_ip burst=60 nodelay;
      rewrite ^__PUBLIC_BASE_PATH__(/.*)$ $1 break;
      proxy_pass http://carbon_api;
      include /etc/nginx/proxy_params;
    }
    location ^~ __PUBLIC_BASE_PATH__/v1/teacher/ {
      limit_req zone=teacher_per_ip burst=80 nodelay;
      rewrite ^__PUBLIC_BASE_PATH__(/.*)$ $1 break;
      proxy_pass http://carbon_api;
      include /etc/nginx/proxy_params;
    }
    location = __PUBLIC_BASE_PATH__/v1/student/sessions/active {
      limit_req zone=api_per_ip burst=200 nodelay;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      rewrite ^__PUBLIC_BASE_PATH__(/.*)$ $1 break;
      proxy_pass http://carbon_api;
      include /etc/nginx/proxy_params;
    }
    location = __PUBLIC_BASE_PATH__/v1 {
      limit_req zone=api_per_ip burst=200 nodelay;
      rewrite ^__PUBLIC_BASE_PATH__(/.*)$ $1 break;
      proxy_pass http://carbon_api;
      include /etc/nginx/proxy_params;
    }
    location ^~ __PUBLIC_BASE_PATH__/v1/ {
      limit_req zone=api_per_ip burst=200 nodelay;
      rewrite ^__PUBLIC_BASE_PATH__(/.*)$ $1 break;
      proxy_pass http://carbon_api;
      include /etc/nginx/proxy_params;
    }

    location = __PUBLIC_BASE_PATH__/health {
      proxy_intercept_errors off;
      proxy_pass http://carbon_api/health;
      include /etc/nginx/proxy_params;
    }
    location = __PUBLIC_BASE_PATH__/ready {
      proxy_intercept_errors off;
      proxy_pass http://carbon_api/ready;
      include /etc/nginx/proxy_params;
    }

    location = __PUBLIC_BASE_PATH__/student {
      proxy_intercept_errors off;
      proxy_pass http://student_web;
      include /etc/nginx/proxy_params;
    }
    location ^~ __PUBLIC_BASE_PATH__/student/ {
      proxy_intercept_errors off;
      proxy_pass http://student_web;
      include /etc/nginx/proxy_params;
    }

    location ^~ __PUBLIC_BASE_PATH__/_next/ {
      proxy_pass http://teacher_web;
      include /etc/nginx/proxy_params;
    }
    location = __PUBLIC_BASE_PATH__/ {
      rewrite ^__PUBLIC_BASE_PATH__/$ __PUBLIC_BASE_PATH__ break;
      proxy_pass http://teacher_web;
      include /etc/nginx/proxy_params;
    }
    location ^~ __PUBLIC_BASE_PATH__/ {
      proxy_pass http://teacher_web;
      include /etc/nginx/proxy_params;
    }

    location / { return 404; }
  }
}
