services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon
      POSTGRES_DB: carbon_trader
    ports: ["5432:5432"]
    volumes: ["carbon_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  carbon_postgres:
